<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overheids Cloud Database</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}" />
</head>

<body>
    <div class="sidebar">
        <div class="logo">NL</div>
        <ul>
            <li>Dashboard</li>
            <li>Data Beheren</li>
            <li>Statistieken</li>
            <li>Instellingen</li>
        </ul>
    </div>
    <div class="main">
        <header>
            <h1>Overheids Cloud Database</h1>
            <button class="logout">Uitloggen</button>
        </header>

        <section class="stats">
            <div class="card">
                <p>Totaal Datasets</p>
                <h2>1,247</h2>
                <small>+12 deze maand</small>
            </div>
            <div class="card">
                <p>Actieve Gemeenten</p>
                <h2>342</h2>
                <small>+5 nieuwe verbindingen</small>
            </div>
            <div class="card">
                <p>Records Verwerkt</p>
                <h2>45.2M</h2>
                <small>+2.1M deze week</small>
            </div>
            <div class="card">
                <p>Systeem Uptime</p>
                <h2>99.9%</h2>
                <small>Betrouwbaar</small>
            </div>
        </section>

    </div>


</body>

</html>
