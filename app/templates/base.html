<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overheids Cloud Database</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}" />
</head>

<body>
    <div class="sidebar">
        <div class="logo">"Wolken"</div>
        <ul>
            <li class="{% if request.path == '/home' %}active-link{% endif %}">
                <a href="{{ url_for('main.index') }}">Dashboard</a>
            </li>
            <li><a href="#">Data Beheren</a></li>
            <li><a href="#">Statistieken</a></li>
            <li class="{% if request.path == '/info' %}active-link{% endif %}">
                <a href="{{ url_for('main.informatie') }}">Informatie</a>
            <li class="{% if request.path == '/contact' %}active-link{% endif %}">
                <a href="{{ url_for('main.contact') }}">Support</a>
            </li>
            <li><a href="#">Instellingen</a></li>
        </ul>
    </div>

    <!-- Alle content komt hier te staan, afhankelijk van welke pagina op is -->
    <div class="main">
        <header>
            <button class="menu-toggle">☰</button>
            <h1>Informatie Over Cloud Database</h1>
            <button class="logout">Uitloggen</button>
        </header>
        
        <section class="mainsection">
            <div>{% block content %}{% endblock %}</div>
        </section>
    </div>

</body>
</html>
