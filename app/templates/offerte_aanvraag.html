<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Offerte Aanvraag</title>
</head>
<body>
    <h1>Vraag een Offerte aan</h1>
    <form method="POST" action="/offerte">
        <label>Naam:</label><br>
        <input type="text" name="naam" required><br><br>

        <label>E-mail:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Onderwerp van uw aanvraag:</label><br>
        <input type="text" name="onderwerp"><br><br>

        <label>Bericht:</label><br>
        <textarea name="bericht" required></textarea><br><br>

        <button type="submit">Versturen</button>
    </form>
</body>
</html>
