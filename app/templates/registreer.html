<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/info.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/support_aanvraag.css') }}">
<head>   


<body>
    <div class="sidebar">
        <div class="logo">"Wolken"</div>
        <ul>
            <li class="{% if request.path == '/home' %}active-link{% endif %}">
                <a href="{{ url_for('main.index') }}">Dashboard</a>
            </li>
            <li class="{% if request.path == '/bestanden' %}active-link{% endif %}">
                <a href="{{ url_for('bestanden.upload_bestand') }}">Data Beheren</a>
            </li>
            <li class="{% if request.path == '/incidenten' %}active-link{% endif %}">
                <a href="{{ url_for('main.incidenten') }}">Incidenten</a>
            </li>
            <li class="{% if request.path == '/nieuwe_incident' %}active-link{% endif %}">
                <a href="{{ url_for('main.nieuwe_incident') }}">Maak Incident</a>
            </li>
            <li class="{% if request.path == '/nieuws' %}active-link{% endif %}">
                <a href="{{ url_for('main.nieuws') }}">Nieuws</a>
            </li>

            <li class="{% if request.path == '/contact' %}active-link{% endif %}">
                <a href="{{ url_for('main.contact') }}">Support</a>
            </li>
            <li class="{% if request.path == '/mijn-tickets' %}active-link{% endif %}">
                <a href="{{ url_for('main.mijn_tickets') }}">Mijn aanvragen</a>
            </li>
            <li class="{% if request.path == '/info' %}active-link{% endif %}">
                <a href="{{ url_for('main.informatie') }}">Informatie</a>
            <li><a href="#">Instellingen</a></li>
        </ul>
    </div>

    <div class="main registreer-page">
        <header>
            <h1>registreer</h1>
        </header>
{% block content %}
  <p> <div class="form-container">
                                {% if error %}
                                        <div class="form-error">{{ error }}</div>
                                {% endif %}
                <form method="POST" action="/registreer" class="registreer-form">
                    <div class="form-group">
                        <label for="voornaam">Voornaam*</label>
                        <input type="text" id="voornaam" name="voornaam" required placeholder="Uw voornaam">
                    </div>
                    <div class="form-group">
                        <label for="achternaam">Achternaam*</label>
                        <input type="text" id="achternaam" name="achternaam" required placeholder="Uw achternaam">
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail*</label>
                        <input type="email" id="email" name="email" required placeholder="Uw e-mailadres">
                    </div>
                    <div class="form-group">
                        <label for="telefoonnummer">Telefoonnummer*</label>
                        <input type="tel" id="telefoonnummer" name="telefoonnummer" required placeholder="Uw telefoonnummer">
                    </div>
                    <div class="form-group">
                        <label for="gebruikersnaam">Gebruikersnaam*</label>
                        <input type="text" id="gebruikersnaam" name="gebruikersnaam" required placeholder="Kies een gebruikersnaam">
                    </div>

                    <div class="form-group">
                        <label for="wachtwoord">Wachtwoord*</label>
                        <input type="password" id="wachtwoord" name="wachtwoord" required placeholder="Voer uw wachtwoord in">
                    </div>

                    <div class="form-group">
                        <label for="wachtwoord_confirm">Bevestig Wachtwoord*</label>
                        <input type="password" id="wachtwoord_confirm" name="wachtwoord_confirm" required placeholder="Bevestig uw wachtwoord">
                    </div>

                    <button type="submit" class="btn-submit">Registreer</button>
                </form>
            </div>
  </p>
{% endblock %}
