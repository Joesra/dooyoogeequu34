deploy:
  image: ubuntu:latest
  stage: deploy
  tags:
    - deploy
  only:
    - Stijn
  before_script:
    - apt-get -yq update
    - apt-get -yqq install ssh
    - install -m 600 -D /dev/null ~/.ssh/id_rsa
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - mkdir -p ~/.ssh
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$SSH_USER@$SSH_HOST" "cd '$WORK_DIR' && git checkout 'Stijn' && git pull && exit"
  after_script:
    - rm -rf ~/.ssh
