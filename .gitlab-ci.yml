stages:
  - deploy
  - build

build:
  image: python:3.11
  stage: build
  only:
    - Stijn
  script:
    # Virtuele omgeving maken
    - python -m venv venv
    - source venv/bin/activate

    # Upgrade pip en installeer dependencies
    - pip install --upgrade pip
    - pip install -r requirements.txt

    - flask run

deploy:
  image: ubuntu:latest
  stage: deploy
  only:
    - Stijn
  # Tag zorgt ervoor dat deze job alleen op specifieke runners draait
  # die het naar de juiste server gaat deployen
  # in dit geval naar de Raspberry Pi van Stijn
  tags:
    - deploy_to_rpi
  script:
    - git config --global user.name "CI Pipeline RPI"
    - git config --global user.email "cipipelinerpi@example.com"
    - cd /var/www/$REPO_NAME
    - git remote set-url origin https://oauth2:$ACCESS_TOKEN_RPI@gitlab.fdmci.hva.nl/propedeuse-hbo-ict/onderwijs/student-projecten/2025-2026/spiegelonderwijs-bim/b3-2425-deopdracht/dooyoogeequu34/
    - git checkout Stijn
    - git pull origin Stijn
    - sudo /bin/systemctl restart flaskapp.service