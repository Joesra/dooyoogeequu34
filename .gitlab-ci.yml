stages:
  - deploy

deploy:
  image: ubuntu:latest
  stage: deploy
  only:
    - Stijn
  tags:
    - deploy

  before_script:
    - sudo apt-get -yqq install ssh
    - install -m 600 -D /dev/null ~/.ssh/id_rsa
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - ssh-keyscan -H $SSH_HOST > ~/. ssh/known_hosts

  script:
    - "cd $WORK_DIR && git checkout Stijn && git pull && exit"

  after_script:
    - rm -rf ~/.ssh
