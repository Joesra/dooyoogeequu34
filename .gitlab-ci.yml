deploy:
  image: ubuntu:latest
  stage: deploy
  tags:
    - deploy
  rules:
    - if: '$CI_COMMIT_REF_NAME == "Stijn"'
  variables:
    GIT_STRATEGY: none  # voorkom lokale HTTPS clone
  before_script:
    - set -e
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      set -e
      ssh "$SSH_USER@$SSH_HOST" "
        cd '$WORK_DIR' &&
        git remote set-url origin git@$SSH_HOST:$REPO_PATH &&
        git checkout '$CI_COMMIT_REF_NAME' &&
        git pull
      "
  after_script:
    - rm -rf ~/.ssh
